<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USA Psychiatrists Dataset</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>.loader{display:none}</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full text-center">
    <h1 class="text-2xl font-bold text-indigo-700 mb-2">USA Psychiatrists</h1>
    <p class="text-gray-600 mb-6">~48,000 licensed doctors (Nov 2025) – CMS NPPES</p>

    <label class="flex items-center justify-center gap-2 mb-5 cursor-pointer">
      <input type="checkbox" id="email" checked class="w-5 h-5 text-indigo-600">
      <span class="text-gray-700">Include business email (~40%)</span>
    </label>

    <button id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
      Download CSV
    </button>

    <div id="loader" class="loader mt-4 text-indigo-600">
      <svg class="animate-spin inline w-5 h-5 mr-2" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
      </svg>
      Building CSV…
    </div>
  </div>

  <script>
    document.getElementById('btn').onclick = () => {
      const email = document.getElementById('email').checked;
      document.getElementById('btn').style.display='none';
      document.getElementById('loader').style.display='block';
      location.href = `/download?email=${email}`;
    };
  </script>
</body>
</html>
