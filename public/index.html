<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USA Psychiatrists Dataset</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader, .state-list { display: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl p-8 max-w-lg w-full">
    <h1 class="text-3xl font-bold text-center text-indigo-700 mb-2">USA Psychiatrists</h1>
    <p class="text-center text-gray-600 mb-6">48,127 doctors • Nov 2025 • CMS NPPES</p>

    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-700 mb-2">Filter by State</label>
      <select id="state" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        <option value="ALL">All States (48,127)</option>
      </select>
    </div>

    <label class="flex items-center gap-2 mb-6 cursor-pointer">
      <input type="checkbox" id="email" checked class="w-5 h-5 text-indigo-600">
      <span class="text-gray-700">Include business email (~40% have it)</span>
    </label>

    <button id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
      Download CSV
    </button>

    <div id="loader" class="loader text-center mt-4 text-indigo-600">
      <svg class="animate-spin inline w-6 h-6 mr-2" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
      </svg>
      <span id="status">Building dataset...</span>
    </div>
  </div>

  <script>
    const states = [
      "AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA",
      "HI","ID","IL","IN","IA","KS","KY","LA","ME","MD",
      "MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ",
      "NM","NY","NC","ND","OH","OK","OR","PA","RI","SC",
      "SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"
    ];

    const select = document.getElementById('state');
    states.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      select.appendChild(opt);
    });

    document.getElementById('btn').onclick = () => {
      const state = document.getElementById('state').value;
      const email = document.getElementById('email').checked;
      const btn = document.getElementById('btn');
      const loader = document.getElementById('loader');
      const status = document.getElementById('status');

      btn.style.display = 'none';
      loader.style.display = 'block';
      status.textContent = state === 'ALL' ? 'Downloading all 48k...' : `Downloading ${state}...`;

      setTimeout(() => {
        location.href = `/download?state=${state}&email=${email}`;
      }, 300);
    };
  </script>
</body>
</html>
